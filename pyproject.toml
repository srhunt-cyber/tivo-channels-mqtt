[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tivo-channels-mqtt"
version = "0.1.0"
description = "Channels Android MQTT: Android TV playback and storage monitoring, accessibility recovery, and optional maintenance controls"
requires-python = ">=3.9"
dependencies = ["paho-mqtt>=2.1,<3"]

[project.scripts]
tivo-channels-mqtt = "tivo_channels_mqtt.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]
